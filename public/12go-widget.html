<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Travel search — 12Go</title>
</head>
<body style="margin:0;font-family:system-ui,sans-serif">
<div id="w" style="max-width:464px"></div>
<div id="loading" style="padding:24px 0;color:#6b6459;font-size:14px">Loading travel search…</div>
<div id="fallback" hidden style="padding:16px 0">
  <a href="https://12go.asia/en?z=15319268&sub_id=magicsamui-guide" target="_blank" rel="noopener noreferrer"
     style="display:inline-block;background:#0e6b63;color:#fff;text-decoration:none;padding:12px 24px;border-radius:999px;font-size:14px;font-weight:500">
    Search ferries, trains &amp; flights on 12Go &rarr;
  </a>
</div>
<div id="powered" style="font:12px sans-serif;padding:4px 0">Powered by <a href="https://12go.asia/?z=15319268&sub_id=magicsamui-guide" target="_blank" rel="noopener noreferrer">12Go system</a></div>
<script>
(function () {
  var tries = 0;
  var ATTRS = {
    "data-one2go": "15319268",
    "data-color": "default",
    "data-language": "en",
    "data-width": "464",
    "data-height": "320",
    "data-border": "1",
    "data-origin": "Koh Samui",
    "data-sub_id": "magicsamui-guide",
    "data-domain": "12go.asia"
  };
  function done() {
    document.getElementById("loading").hidden = true;
  }
  function showFallback() {
    done();
    document.getElementById("fallback").hidden = false;
  }
  function check() {
    if (document.querySelector("form")) { done(); return; }
    if (tries < 3) attempt(); else showFallback();
  }
  function attempt() {
    tries++;
    var settled = false;
    function settle(delay) {
      if (settled) return;
      settled = true;
      setTimeout(check, delay);
    }
    var s = document.createElement("script");
    s.src = "https://cdn0.trainbusferry.com/tools/form/en/?id=15319268&domain=12go.asia&r=" + Date.now();
    for (var k in ATTRS) s.setAttribute(k, ATTRS[k]);
    s.onload = function () { settle(900); };
    s.onerror = function () { settle(400); };
    setTimeout(function () { settle(0); }, 8000);
    document.getElementById("w").appendChild(s);
  }
  attempt();
})();
</script>
</body>
</html>
